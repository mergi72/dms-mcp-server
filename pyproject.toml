[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dms-mcp-server"
version = "0.10.2"
description = "Read-only MCP server for DMS Provider Bridge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dms-mcp-server team" }]
dependencies = [
  "httpx>=0.28.1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[project.scripts]
dms-mcp-server = "dms_mcp_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/dms_mcp_server"]
